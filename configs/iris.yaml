# Eager FP32 correctness configuration; GPU serving validation is still required.
model: "iris"
model_kwargs:
  game: "Breakout"
  max_rollout_horizon: 20
  max_batch_size: 2
node_groups:
  - node_names: [image_encoder, world_model, image_decoder, initial_image_decoder]
    ranks: [0]
resources:
  world_kv:
    page_size: 16
    max_num_pages: 64
    prefix_cache: false
  world_attn:
    backend: torch
  encoder_attn:
    backend: torch
  decoder_attn:
    backend: torch
